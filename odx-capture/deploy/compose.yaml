# odx-orchestrator behind Caddy (HTTPS for ODX_DOMAIN from Let's Encrypt). Run ./up.sh, or: docker compose up -d --build
services:
  orchestrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ODX_ACCESS_KEY: ${ODX_ACCESS_KEY:?set ODX_ACCESS_KEY in .env}
    command: ["--out", "/data", "--game-profile", "/app/games/${ODX_GAME_PROFILE:-cs2.json}", "--vendor", "${ODX_VENDOR:-odx}"]
    volumes:
      - ./sessions:/data
    ports:
      # Time service (SNTP): players measure their clock against <domain>:12300 directly, it cannot go through Caddy.
      - "12300:12300/udp"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [orchestrator]
    environment:
      ODX_DOMAIN: ${ODX_DOMAIN:?set ODX_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
