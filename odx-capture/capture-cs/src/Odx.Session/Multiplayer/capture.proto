// Records of the binary files in a spec v3 session. schema.bin.gz is this file as a gzip-compressed
// google.protobuf.FileDescriptorSet. Each .bin file is a sequence of varint length-delimited messages: a FileHeader, then
// messages of the type it names.
syntax = "proto3";

package odx.capture.v1;

option csharp_namespace = "Odx.Session.Proto";

message FileHeader {
  string record_type = 1;  // full name of every following message, e.g. "odx.capture.v1.FrameRecord"
  string spec_version = 2;
  string session_id = 3;
  string player_id = 4;
  string tool_version = 5;
}

// One frames.csv row (spec v3 §2.2) at full double precision, plus when the frame was captured on the orchestrator's
// clock. Unset optional fields and empty repeated fields are null in frames.csv.
message FrameRecord {
  int64 frame_id = 1;
  int64 timestamp_ms = 2;
  int64 server_time_us = 3;  // UTC microseconds since the Unix epoch; 0 when the player has no clock samples
  repeated double c2w = 4;   // C2W_M00..C2W_M33, row-major
  optional string camera_model = 5;
  optional double camera_fx = 6;
  optional double camera_fy = 7;
  optional double camera_cx = 8;
  optional double camera_cy = 9;
  repeated double distortion = 10;  // camera_radial_k1..k6, camera_tangential_p1, p2
  optional string input_keys = 11;
  optional string input_actions = 12;
  optional string input_mouse_buttons = 13;
  double input_mouse_dx = 14;
  double input_mouse_dy = 15;
}

// One game message seen on this player's machine (packets.bin, spec v3 §2.3): a decoded protocol message (e.g. one
// Warcraft III W3GS message out of a TCP stream), or one UDP/TCP payload for protocols kept raw (encrypted CS2).
// In server/packets.bin (spec v3 §3.3) one net message the game server exchanged with a client, logged inside the server:
// transport "netmessage", OUT = server to client, peer_id names the client, payload is empty (decoded_json holds it all).
message PacketRecord {
  int64 server_time_us = 1;  // capture time on the orchestrator's clock (UTC microseconds)
  int64 local_time_us = 2;   // capture time on this machine's Windows clock
  Direction direction = 3;
  string transport = 4;      // "tcp" or "udp"
  string local_endpoint = 5;
  string remote_endpoint = 6;
  string message = 7;        // decoded message name; empty when kept raw
  bytes payload = 8;         // the message's bytes as sent on the wire (raw: the transport payload)
  string decoded_json = 9;   // the decoded fields, as in packets.txt; empty when kept raw
  string peer_id = 10;       // server side: the client's SteamID64 ("0" until Steam authenticated it)
  string peer_player_id = 11;  // server side: the client's player id in this session, when it is one of the players

  enum Direction {
    DIRECTION_UNKNOWN = 0;
    IN = 1;
    OUT = 2;
  }
}

// The authoritative game state at one server tick (server/server_state.bin, spec v3 §3.1), from the server's own
// recording of the match (CS2: a SourceTV demo).
message ServerStateRecord {
  int32 tick = 1;            // the game server's tick
  int64 server_time_us = 2;  // the tick on the orchestrator's clock (UTC microseconds)
  repeated PlayerState players = 3;
  repeated WorldEntity entities = 4;
  bool warmup = 5;
  bool freeze_period = 6;    // round start freeze: players cannot move yet
  int32 rounds_played = 7;
  string phase = 8;          // "warmup", "freeze", "live" or "over" (between a round's end and the next)
  int64 round_start_us = 9;  // when the game's current round started (UTC microseconds); 0 before any
  int32 round_seconds = 10;  // the game's round length
  double seconds_left = 11;  // on the game's round timer (round_seconds from round_start_us)
  bool bomb_planted = 12;
}

message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

// Game units and degrees, as the game networks them.
message PlayerState {
  uint64 steam_id = 1;  // 0 for bots
  string name = 2;
  int32 team = 3;       // CS2: 1 spectator, 2 terrorists, 3 counter-terrorists
  bool alive = 4;
  int32 health = 5;
  int32 armor = 6;
  Vec3 position = 7;    // feet
  double pitch = 8;     // eye angles
  double yaw = 9;
  Vec3 velocity = 10;
  string active_weapon = 11;  // the weapon's entity class, e.g. "CAK47"
  bool ducking = 12;
  bool scoped = 13;
  bool walking = 14;
  int32 slot = 15;      // player slot on the server
  string player_id = 16;     // the player's id in this session (players/<player-id>/); empty for others and bots
  Vec3 eye_position = 17;    // the camera: position + view offset
  double fov_deg = 18;       // horizontal field of view at 4:3, as CS2 defines it (90 unless zoomed)
  int32 ping_ms = 19;
  int32 kills = 20;          // in the match so far
  int32 deaths = 21;
  int32 assists = 22;
  bool connected = 23;
  bool is_bot = 24;
}

// Other entities that matter to play (CS2: grenades in flight, the bomb carried, dropped or planted).
message WorldEntity {
  int32 index = 1;
  string class_name = 2;
  Vec3 position = 3;
  uint64 owner_steam_id = 4;  // who threw or carries it, 0 when none
  string state = 5;           // e.g. a planted bomb's "site_a" / "defusing"
}
