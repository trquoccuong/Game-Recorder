[project]
name = "odyssey-capture"
version = "0.1.0"
description = "Canonical-format tooling for Odyssey game data capture: geometry, frames.csv building, validation."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "jsonschema>=4.23",
]

[project.scripts]
odyssey-validate = "odyssey_capture.validate:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odyssey_capture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
