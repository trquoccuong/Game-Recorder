[project]
name = "client-capture"
version = "0.1.0"
description = "Canonical-format tooling for Client game data capture: geometry, frames.csv building, validation."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "jsonschema>=4.23",
]

[project.scripts]
client-validate = "client_capture.validate:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client_capture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
