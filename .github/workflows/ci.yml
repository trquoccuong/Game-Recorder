name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: capture/dotnet/global.json

      # Video fixtures are encoded with ffmpeg; ffprobe cross-checks the MP4 reader.
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: dotnet build and test
        working-directory: capture/dotnet
        run: |
          dotnet build OdxCapture.sln -c Release
          dotnet test OdxCapture.sln -c Release --no-build

      # Built after dotnet/ so ctest can run `odx build` + `odx validate` on the synthetic capture.
      - name: extractor build and test
        working-directory: capture/native/extractor
        run: |
          cmake -B build
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure

  # The Arma Reforger launcher targets .NET Framework 4.8 (reference assemblies from NuGet), so it builds on Linux too.
  # The exe, with the spike's addon embedded, is the run's artifact; on main it also replaces the release
  # "reforger-launcher", so the newest one is always at releases/download/reforger-launcher/TbrainReforger.exe.
  reforger-launcher:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: reforger-launcher-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build TbrainReforger.exe
        run: dotnet build -c Release research/reforger-camera-spike/launcher/TbrainReforger

      - uses: actions/upload-artifact@v4
        with:
          name: TbrainReforger
          path: research/reforger-camera-spike/launcher/TbrainReforger/bin/Release/net48/TbrainReforger.exe

      - name: Update the reforger-launcher release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete reforger-launcher --cleanup-tag --yes || true
          gh release create reforger-launcher \
            research/reforger-camera-spike/launcher/TbrainReforger/bin/Release/net48/TbrainReforger.exe \
            --target "$GITHUB_SHA" --latest=false --title "Tbrain Reforger launcher" \
            --notes "Built from ${GITHUB_SHA::7}. Copy TbrainReforger.exe anywhere on the player's PC and double-click (research/reforger-camera-spike/README.md)."

  # The Arma 3 launcher embeds the C++ tbrain_capture_x64.dll, so unlike the Reforger one it needs MSVC + CMake and runs
  # on Windows. build.ps1 builds the DLL (Release) then the net48 launcher that embeds it and the addon source; the
  # launcher packs the .pbo itself, so no Arma 3 Tools are needed. On main it replaces the rolling release
  # "arma3-launcher", so the newest one is always at releases/download/arma3-launcher/TbrainArma3.exe.
  arma3-launcher:
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency: arma3-launcher-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build TbrainArma3.exe
        shell: pwsh
        working-directory: capture/native/arma3-mod
        run: ./build.ps1 -OutDir dist

      - uses: actions/upload-artifact@v4
        with:
          name: TbrainArma3
          path: capture/native/arma3-mod/dist/TbrainArma3.exe

      - name: Update the arma3-launcher release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete arma3-launcher --cleanup-tag --yes 2>$null
          gh release create arma3-launcher `
            capture/native/arma3-mod/dist/TbrainArma3.exe `
            --target $env:GITHUB_SHA --latest=false --title "Tbrain Arma 3 launcher" `
            --notes "Built from $($env:GITHUB_SHA.Substring(0,7)). Copy TbrainArma3.exe anywhere on the player's PC and double-click (document/games/arma3.md)."
