name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: capture/dotnet/global.json

      # Video fixtures are encoded with ffmpeg; ffprobe cross-checks the MP4 reader.
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: dotnet build and test
        working-directory: capture/dotnet
        run: |
          dotnet build OdxCapture.sln -c Release
          dotnet test OdxCapture.sln -c Release --no-build

      # Built after dotnet/ so ctest can run `odx build` + `odx validate` on the synthetic capture.
      - name: extractor build and test
        working-directory: capture/native/extractor
        run: |
          cmake -B build
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure

  # The Arma Reforger launcher targets .NET Framework 4.8 (reference assemblies from NuGet), so it builds on Linux too.
  # The exe, with the capture mod embedded, is the run's artifact; releases come from release-reforger.yml.
  reforger-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build OdxReforger.exe
        run: dotnet build -c Release research/reforger-camera-spike/launcher/OdxReforger

      - uses: actions/upload-artifact@v4
        with:
          name: OdxReforger
          path: research/reforger-camera-spike/launcher/OdxReforger/bin/Release/net48/OdxReforger.exe
